# STEP 2: Run these exact PowerShell commands after applying manifests.yaml:
#   $agentUID = kubectl get agent research-agent -n default -o jsonpath='{.metadata.uid}'
#   (Get-Content .\samples\autonomy\trustprofile.template.yaml -Raw).Replace('${AGENT_UID}', $agentUID) | kubectl apply -f -
#
# Kubernetes generates the Agent UID. This template binds the TrustProfile to
# that exact Agent incarnation. Do not add metadata.uid to either manifest.
# RuntimeApproval is not user-created; trusted gateways create it.
---
kind: TrustProfile
apiVersion: kognition.dev/v1alpha1
metadata:
  name: research-agent-trust
  namespace: default
spec:
  agentRef:
    name: research-agent
  agentIncarnationUID: ${AGENT_UID}
  initialScore: 50
  initialClass: supervised
  maxClass: autonomous
  evaluationInterval: "24h"