{{- if .Values.credentials.create }}
apiVersion: kognition.dev/v1alpha1
kind: SecretRef
metadata:
  name: {{ .Values.credentials.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kognition-multi-agent.labels" . | nindent 4 }}
  {{- if eq .Values.credentials.backendType "internal" }}
  annotations:
    kognition.dev/internal-secret-data: |
      {
        "type": "azure-identity",
        "credentialType": "client-secret",
        "tenantId": {{ .Values.credentials.azure.tenantId | quote }},
        "clientId": {{ .Values.credentials.azure.clientId | quote }},
        "clientSecret": {{ .Values.credentials.azure.clientSecret | quote }}
      }
  {{- end }}
spec:
  backendType: {{ .Values.credentials.backendType }}
  backendRef: {{ .Values.credentials.backendRef }}
  key: {{ .Values.credentials.key }}
{{- end }}
