{{- if .Values.identities.enabled }}
{{- range .Values.identities.agents }}
---
apiVersion: kognition.dev/v1alpha1
kind: AgentIdentity
metadata:
  name: {{ . }}-identity
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "kognition-governance.labels" $ | nindent 4 }}
spec:
  agentRef:
    name: {{ . }}
{{- end }}
{{- end }}
