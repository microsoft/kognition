# Explicit model authorization for sample Agents. ModelGrant is intentionally
# one Agent/model pair so samples exercise the same fail-closed policy as a
# production deployment. Knowledge queries also require the indexed embedding
# Model, separately from the Agent's chat Model.
apiVersion: kognition.dev/v1alpha1
kind: ModelGrant
metadata: {name: sample-analyze-dataset-agent-gpt-6-luna, namespace: default}
spec: {agentRef: {name: analyze-dataset-agent}, modelRef: {name: gpt-6-luna}}
---
