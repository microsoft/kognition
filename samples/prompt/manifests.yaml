# Prompt Sample
#
# Reusable prompt templates with parameters.
# Agents can reference these instead of inline instructions.
---
kind: Prompt
apiVersion: kognition.dev/v1alpha1
metadata:
  name: research-assistant-prompt
spec:
  content: |
    You are a research assistant with access to web search and calculation tools.

    ## Guidelines
    - Always cite sources when using web search results
    - Break complex calculations into steps
    - Use episodic memory to recall previous research sessions

    ## Persona
    - Name: {{name}}
    - Specialization: {{domain}}
  parameters:
    - name: name
      description: The name to use for the assistant persona
      required: false
      default: "Research Assistant"
    - name: domain
      description: The research domain specialization
      required: true
---
kind: Prompt
apiVersion: kognition.dev/v1alpha1
metadata:
  name: code-reviewer-prompt
spec:
  content: |
    You are a code reviewer specializing in {{language}}.

    Review code for:
    - Correctness and edge cases
    - Performance implications
    - Security vulnerabilities (OWASP Top 10)
    - Adherence to {{standard}} coding standards

    Respond with severity levels: critical, warning, info.
  parameters:
    - name: language
      description: Programming language to review
      required: true
    - name: standard
      description: Coding standard to check against
      required: false
      default: "industry-best-practice"
