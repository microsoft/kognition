---
# Local S3-compatible fixture. The Service name remains a compatibility alias.
# Data is ephemeral; apply.ps1 uploads and verifies the corpus before indexing.
#
# The development credentials are public example values, not production secrets.
apiVersion: v1
kind: Namespace
metadata:
  name: samples-s3-blob-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: samples-s3-blob-services
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: s3-store
          image: docker.io/kognition-manual/s3-fixture@sha256:0df25bd9533e0ebb828fdd75348594fd4a9e5098c11ff1374bacbfe5031d828d
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "mini"
            - "-dir=/data"
            - "-admin.ui=false"
            - "-s3.port.iceberg=0"
            - "-s3.port.lance=0"
            - "-master.volumeSizeLimitMB=16"
            - "-volume.max=4"
          env:
            - name: HOME
              value: /tmp
            - name: AWS_ACCESS_KEY_ID
              value: minioadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: minioadmin
            - name: S3_BUCKET
              value: product-docs
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: samples-s3-blob-services
  labels:
    app.kubernetes.io/name: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s3-store-isolation
  namespace: samples-s3-blob-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              kognition.dev/component: kb-ingester
      ports:
        - protocol: TCP
          port: 8333
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: samples-s3-blob-services
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
