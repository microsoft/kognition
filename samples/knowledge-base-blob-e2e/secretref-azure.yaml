---
# Azure Storage credentials for the KB ingester. Pick ONE of the three
# key sets — connection string, account key, or SAS token — and delete
# the other two before applying.
#
# If you're on AKS with Azure Workload Identity, omit this file and
# remove `credentialSecretRef` from kb.yaml; the ingester will fall back
# to the pod's federated identity provided it has "Storage Blob Data
# Reader" on the account.
apiVersion: kognition.dev/v1alpha1
kind: SecretRef
metadata:
  name: azure-blob-creds
  namespace: default
  annotations:
    # The apiserver writes this annotation when the SecretRef is created
    # through the standard admission path. When applying by hand, embed
    # the credentials directly here so the KB reconciler can pick them
    # up. Use exactly ONE combination of keys:
    #
    #   1. connectionString
    #   2. accountName + accountKey
    #   3. accountName + sasToken
    kognition.dev/internal-secret-data: |
      {"type":"azure-storage","connectionString":"DefaultEndpointsProtocol=https;AccountName=REPLACE_ME;AccountKey=REPLACE_ME;EndpointSuffix=core.windows.net"}
spec:
  type: azure-storage
