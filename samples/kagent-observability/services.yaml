apiVersion: v1
kind: ConfigMap
metadata: {name: porting-prometheus, namespace: recovery-runtime}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: porting-prometheus
        static_configs:
          - targets: ["127.0.0.1:443"]
---
apiVersion: v1
kind: Pod
metadata:
  name: porting-prometheus
  namespace: recovery-runtime
  labels: {app: porting-prometheus, kognition-fixture: porting-20261008}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
    sysctls: [{name: net.ipv4.ip_unprivileged_port_start, value: "0"}]
  containers:
    - name: prometheus
      image: docker.io/prom/prometheus@sha256:29c1e0b48ad816750245dea3d65ac3ce57dda30547e67b1e9a5176e2953cc4dc
      imagePullPolicy: Never
      args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.listen-address=:443"]
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: config, mountPath: /etc/prometheus, readOnly: true}
        - {name: data, mountPath: /prometheus}
      readinessProbe: {httpGet: {path: /-/ready, port: 443}, periodSeconds: 2}
  volumes:
    - {name: config, configMap: {name: porting-prometheus}}
