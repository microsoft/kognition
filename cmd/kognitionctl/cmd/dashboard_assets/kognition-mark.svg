<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Kognition logo mark</title>
  <desc id="description">A connected letter K inside a three-part reconciliation loop.</desc>
  <defs>
    <linearGradient id="field" x1="70" y1="48" x2="438" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172337"/>
      <stop offset="1" stop-color="#0A0F18"/>
    </linearGradient>
    <linearGradient id="loopA" x1="80" y1="90" x2="385" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#71E5FF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="loopB" x1="429" y1="146" x2="337" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D6A9"/>
      <stop offset="1" stop-color="#22A06B"/>
    </linearGradient>
    <linearGradient id="loopC" x1="291" y1="446" x2="69" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4C95D"/>
      <stop offset="1" stop-color="#EF8F5A"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 44 44" refX="14" refY="22" markerWidth="44" markerHeight="44" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M4 4L40 22L4 40L13 22Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 44 44" refX="14" refY="22" markerWidth="44" markerHeight="44" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M4 4L40 22L4 40L13 22Z" fill="#22A06B"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 44 44" refX="14" refY="22" markerWidth="44" markerHeight="44" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M4 4L40 22L4 40L13 22Z" fill="#EF8F5A"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#05080D" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#field)" filter="url(#shadow)"/>
  <path d="M96.652 164A184 184 0 0 1 379.144 119.264" fill="none" stroke="url(#loopA)" stroke-width="24" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M415.349 164A184 184 0 0 1 312.862 430.995" fill="none" stroke="url(#loopB)" stroke-width="24" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <path d="M256 440A184 184 0 0 1 76.021 217.742" fill="none" stroke="url(#loopC)" stroke-width="24" stroke-linecap="round" marker-end="url(#arrowOrange)"/>

  <path d="M196 160V352M196 256L323 166M196 256L323 346" fill="none" stroke="#F7FAFC" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="196" cy="160" r="15" fill="#71E5FF" stroke="#DDF8FF" stroke-width="6"/>
  <circle cx="323" cy="166" r="15" fill="#55D6A9" stroke="#DDFFF3" stroke-width="6"/>
  <circle cx="323" cy="346" r="15" fill="#F4C95D" stroke="#FFF3CF" stroke-width="6"/>
  <circle cx="196" cy="352" r="15" fill="#EF8F5A" stroke="#FFE7D9" stroke-width="6"/>
  <circle cx="196" cy="256" r="30" fill="#0D1522" stroke="#71E5FF" stroke-width="8" filter="url(#glow)"/>
  <circle cx="196" cy="256" r="9" fill="#F7FAFC"/>
</svg>