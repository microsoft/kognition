name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE.TXT"
      - "NOTICE"
      - "PRIVACY"
      - "tools/distribution_notices.py"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE.TXT"
      - "NOTICE"
      - "PRIVACY"
      - "tools/distribution_notices.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  DOCS_SITE_URL: https://microsoft.github.io
  DOCS_BASE_PATH: /kognition/

jobs:
  build:
    name: Validate documentation and notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Test documentation tooling and publication boundaries
        id: tests
        run: npm test
      - name: Check types and content
        id: types
        run: npm run check
      - name: Fetch verified tutorial release assets
        id: media
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run tutorial:fetch
      - name: Build site
        id: site
        run: npm run build
      - name: Validate rendered pages, anchors and assets
        id: links
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
        run: npm run check-links
      - name: Validate non-publishing pages without private media downloads
        id: preview_links
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request' || vars.DOCS_PAGES_ENABLED != 'true'
        run: npm run check-links -- --without-tutorial-media
      - name: Verify distribution notices
        id: notices
        run: npm run notices
      - name: Upload notice verification evidence
        id: evidence
        if: always() && steps.notices.outcome != 'skipped' && steps.notices.outcome != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-notice-evidence-${{ github.run_id }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: |
            website/.astro/published-files.json
            website/.astro/build-tool-notices/inventory.json
            website/.astro/build-tool-notices/NOTICE
            website/dist/third-party/inventory.json
            website/dist/third-party/NOTICE
      - name: Upload Pages artifact
        id: upload
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
      - name: Summarize documentation outcomes
        id: summary
        if: always()
        env:
          DOCS_PUBLISH_ENABLED: ${{ vars.DOCS_PAGES_ENABLED == 'true' }}
          DOCS_STEP_OUTCOMES: >-
            {
              "checkout": "${{ steps.checkout.outcome }}",
              "node": "${{ steps.node.outcome }}",
              "install": "${{ steps.install.outcome }}",
              "tests": "${{ steps.tests.outcome }}",
              "types": "${{ steps.types.outcome }}",
              "media": "${{ steps.media.outcome }}",
              "site": "${{ steps.site.outcome }}",
              "links": "${{ steps.links.outcome }}",
              "preview_links": "${{ steps.preview_links.outcome }}",
              "notices": "${{ steps.notices.outcome }}",
              "evidence": "${{ steps.evidence.outcome }}",
              "upload": "${{ steps.upload.outcome }}"
            }
        run: node scripts/report-documentation.mjs

  deploy:
    name: Deploy documentation to Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing approved Pages site
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
