name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE.TXT"
      - "NOTICE"
      - "PRIVACY"
      - "tools/distribution_notices.py"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE.TXT"
      - "NOTICE"
      - "PRIVACY"
      - "tools/distribution_notices.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://microsoft.github.io' }}
  DOCS_BASE_PATH: ${{ vars.DOCS_BASE_PATH || '/kognition/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test documentation tooling and publication boundaries
        run: npm test
      - name: Check types and content
        run: npm run check
      - name: Fetch verified tutorial release assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run tutorial:fetch
      - name: Build site
        run: npm run build
      - name: Validate rendered pages, anchors and assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
        run: npm run check-links
      - name: Validate non-publishing pages without private media downloads
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request' || vars.DOCS_PAGES_ENABLED != 'true'
        run: npm run check-links -- --without-tutorial-media
      - name: Report deployment policy
        env:
          PUBLISH_ENABLED: ${{ vars.DOCS_PAGES_ENABLED == 'true' }}
        run: |
          echo "Documentation build and link validation passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing enabled: ${PUBLISH_ENABLED}. Deployment requires a trusted main run and approved Pages configuration." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify distribution notices
        run: npm run notices
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing approved Pages site
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
