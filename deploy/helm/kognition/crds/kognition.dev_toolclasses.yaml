---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: toolclasses.kognition.dev
spec:
  group: kognition.dev
  names:
    kind: ToolClass
    listKind: ToolClassList
    plural: toolclasses
    singular: toolclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provisioner
      name: Provisioner
      type: string
    - jsonPath: .spec.executionTier
      name: Tier
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ToolClass defines a class of tool provisioner (cluster-scoped).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ToolClassSpec defines the provisioner for a class of tools.
            properties:
              executionTier:
                description: ExecutionTier defines the isolation level for tools of
                  this class.
                enum:
                - process
                - sidecar
                - pod
                - vm
                type: string
              parameters:
                additionalProperties:
                  type: string
                description: Parameters are provisioner-specific configuration.
                type: object
              provisioner:
                description: Provisioner is the CPI provider name (e.g., "mcp", "openapi").
                type: string
              resourceLimits:
                description: ResourceLimits defines maximum resource limits for tools
                  of this class.
                properties:
                  maxCpuMilli:
                    description: MaxCPUMilli is the maximum CPU in millicores any
                      tool in this class may use.
                    format: int64
                    type: integer
                  maxMemoryMB:
                    description: MaxMemoryMB is the maximum memory in megabytes any
                      tool in this class may use.
                    format: int64
                    type: integer
                  maxTimeout:
                    description: MaxTimeout is the maximum execution timeout for tools
                      of this class.
                    type: string
                type: object
              sandboxDefaults:
                description: SandboxDefaults provides default sandbox limits for tools
                  of this class.
                properties:
                  cpuMilli:
                    description: CPUMilli is the CPU limit in millicores.
                    format: int64
                    type: integer
                  memoryMB:
                    description: MemoryMB is the memory limit in megabytes.
                    format: int64
                    type: integer
                  networkPolicy:
                    description: NetworkPolicy restricts network access ("none", "egress-only",
                      "full").
                    type: string
                  timeout:
                    description: |-
                      Timeout is the maximum wall-clock duration for one sandboxed invocation.
                      Uses Go duration syntax (for example, "2s", "500ms").
                    type: string
                type: object
              sandboxImage:
                description: |-
                  SandboxImage is the class-approved OCI image used for one-shot exec
                  health probes when executionTier is pod.
                type: string
              stdioCommand:
                description: |-
                  StdioCommand is the class-approved direct argv that starts an MCP stdio
                  server in SandboxImage when executionTier is pod.
                items:
                  type: string
                type: array
              transport:
                description: Transport defines the communication protocol for tools
                  of this class.
                enum:
                - stdio
                - sse
                - http
                type: string
            required:
            - provisioner
            type: object
          status:
            description: ToolClassStatus describes the observed state of a ToolClass.
            properties:
              conditions:
                description: Conditions contains the current conditions of the ToolClass.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message is a human-readable message describing the current
                  phase.
                type: string
              phase:
                description: Phase is the lifecycle phase (Pending|Ready|Failed).
                type: string
              provisioned:
                description: Provisioned indicates that the execution tier has been
                  created.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
