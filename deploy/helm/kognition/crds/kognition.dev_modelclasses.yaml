---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: modelclasses.kognition.dev
spec:
  group: kognition.dev
  names:
    kind: ModelClass
    listKind: ModelClassList
    plural: modelclasses
    singular: modelclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provisioner
      name: Provisioner
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelClass defines a class of LLM providers (cluster-scoped).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelClassSpec defines the provisioner configuration for
              model access.
            properties:
              contextWindow:
                description: ContextWindow is the maximum token context window.
                format: int64
                type: integer
              costTier:
                description: CostTier indicates relative cost ("low", "medium", "high",
                  "premium").
                type: string
              healthProbe:
                description: HealthProbe configures the model health probe.
                properties:
                  endpoint:
                    description: Endpoint is the health probe endpoint.
                    type: string
                  errorRateThreshold:
                    description: |-
                      ErrorRateThreshold is the error rate percentage (0-100) at which an
                      "error-rate-threshold" probe degrades the class. It is measured over the
                      provider failures of recent real model calls to the class's Models, needs at
                      least 5 calls and defaults to 50 when unset. An explicit zero is preserved.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  failureThreshold:
                    default: 3
                    description: FailureThreshold is the number of failures before
                      marking unhealthy.
                    format: int32
                    type: integer
                  intervalSeconds:
                    default: 60
                    description: IntervalSeconds is the probe interval.
                    format: int32
                    type: integer
                  latencyThresholdMs:
                    description: LatencyThresholdMs is the latency threshold in milliseconds.
                    format: int64
                    type: integer
                  successThreshold:
                    default: 1
                    description: SuccessThreshold is the number of successes before
                      marking healthy again.
                    format: int32
                    type: integer
                  timeoutSeconds:
                    default: 10
                    description: TimeoutSeconds is the probe timeout.
                    format: int32
                    type: integer
                  type:
                    description: |-
                      Type is the probe type: "inference-ping" (default), "latency-threshold" or
                      "error-rate-threshold". Other values are treated as "inference-ping".
                    type: string
                type: object
              latencyClass:
                description: LatencyClass categorises expected response latency ("low",
                  "medium", "high").
                type: string
              modalities:
                description: Modalities lists supported modalities (e.g., ["text",
                  "image", "audio"]).
                items:
                  type: string
                type: array
              parameters:
                additionalProperties:
                  type: string
                description: Parameters are provider-specific configuration.
                type: object
              provisioner:
                description: Provisioner is the CPI provider name (e.g., "openai",
                  "azure-openai", "anthropic").
                type: string
              versionCandidates:
                additionalProperties:
                  properties:
                    invocationProfileUID:
                      type: string
                    invocationProfileDigest:
                      type: string
                    modelName:
                      type: string
                    modelResourceVersion:
                      format: int64
                      type: integer
                    modelUID:
                      type: string
                    namespace:
                      type: string
                    specDigest:
                      type: string
                  required:
                  - modelName
                  - modelResourceVersion
                  - modelUID
                  - namespace
                  - specDigest
                  type: object
                type: object
              versionPin:
                description: VersionPin pins the model to a specific version.
                type: string
            required:
            - provisioner
            type: object
          status:
            description: ModelClassStatus describes the observed state of a ModelClass.
            properties:
              activeBinding:
                properties:
                  invocationProfileUID:
                    type: string
                  invocationProfileDigest:
                    type: string
                  modelName:
                    type: string
                  modelResourceVersion:
                    format: int64
                    type: integer
                  modelUID:
                    type: string
                  namespace:
                    type: string
                  specDigest:
                    type: string
                required:
                - modelName
                - modelResourceVersion
                - modelUID
                - namespace
                - specDigest
                type: object
              activeVersion:
                description: ActiveVersion is the currently active model version.
                type: string
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveFailures:
                description: ConsecutiveFailures is the number of consecutive probe
                  failures.
                format: int32
                type: integer
              consecutiveSuccesses:
                description: ConsecutiveSuccesses is the number of consecutive probe
                  successes.
                format: int32
                type: integer
              fallbackClass:
                description: FallbackClass is the ModelClass to fall back to if this
                  one is unhealthy.
                type: string
              health:
                description: Health is the model health status ("Healthy", "Degraded",
                  "Unknown").
                type: string
              lastProbeTime:
                description: LastProbeTime is the last time the health probe ran.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                type: string
              provisioned:
                description: Provisioned indicates the model endpoint is reachable.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
