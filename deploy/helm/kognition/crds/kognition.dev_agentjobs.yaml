---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agentjobs.kognition.dev
spec:
  group: kognition.dev
  names:
    kind: AgentJob
    listKind: AgentJobList
    plural: agentjobs
    singular: agentjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.succeeded
      name: Succeeded
      type: integer
    - jsonPath: .status.failed
      name: Failed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentJob represents a one-shot agent execution.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentJobSpec defines a one-shot agent task.
            properties:
              agentRef:
                description: AgentRef references an existing Agent resource.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                required:
                - name
                type: object
              agentRevision:
                description: |-
                  AgentRevision optionally selects an immutable revision of AgentRef for
                  execution while preserving AgentRef as the authorization identity.
                format: int64
                type: integer
              agentSpec:
                description: AgentSpec allows inline definition of a one-shot agent
                  workload.
                properties:
                  autonomyClassRef:
                    description: AutonomyClassRef references the AutonomyClass governing
                      this agent.
                    properties:
                      name:
                        description: Name is the name of the referenced resource.
                        type: string
                    required:
                    - name
                    type: object
                  companions:
                    description: Companions lists companion agents that collaborate
                      with this agent.
                    items:
                      description: LocalObjectReference references a resource by name
                        within the same namespace.
                      properties:
                        name:
                          description: Name is the name of the referenced resource.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  instructions:
                    description: Instructions contains the agent's system prompt or
                      a reference to a Prompt resource.
                    properties:
                      inline:
                        description: Inline contains the instructions text directly.
                        type: string
                      ref:
                        description: Ref references a Prompt resource.
                        properties:
                          name:
                            description: Name is the name of the referenced resource.
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  knowledgeBaseClaims:
                    description: |-
                      KnowledgeBaseClaims lists KnowledgeBaseClaim references binding this
                      agent to KnowledgeBases in the same namespace. Agents never reference
                      a KnowledgeBase directly; the claim carries access mode, retrieval
                      overrides, and usage quotas.
                    items:
                      description: |-
                        KnowledgeBaseClaimRef references a KnowledgeBaseClaim in the same
                        namespace as the Agent, with an optional readiness dependency.
                      properties:
                        name:
                          description: Name names the KnowledgeBaseClaim in the same
                            namespace as the Agent.
                          type: string
                        required:
                          description: |-
                            Required, when true, causes the Agent to depend on the referenced
                            KnowledgeBaseClaim (and its bound KnowledgeBase) being Ready.
                          type: boolean
                      required:
                      - name
                      type: object
                    type: array
                  memory:
                    description: Memory configures memory access for this agent.
                    properties:
                      claims:
                        description: Claims lists memory claims to mount.
                        items:
                          description: LocalObjectReference references a resource
                            by name within the same namespace.
                          properties:
                            name:
                              description: Name is the name of the referenced resource.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                    type: object
                  modelRef:
                    description: ModelRef references the Model resource to use for
                      inference.
                    properties:
                      name:
                        description: Name is the name of the referenced resource.
                        type: string
                    required:
                    - name
                    type: object
                  probes:
                    description: Probes configures health, readiness, and reasoning
                      probes for this agent.
                    properties:
                      healthProbe:
                        description: HealthProbe configures runtime liveness checks.
                        properties:
                          failureThreshold:
                            default: 3
                            description: FailureThreshold is the consecutive failures
                              before marking unhealthy.
                            format: int32
                            type: integer
                          intervalSeconds:
                            default: 30
                            description: IntervalSeconds is how often (in seconds)
                              to perform the probe.
                            format: int32
                            type: integer
                          successThreshold:
                            default: 1
                            description: SuccessThreshold is the consecutive successes
                              to recover.
                            format: int32
                            type: integer
                          timeoutSeconds:
                            default: 5
                            description: TimeoutSeconds is the probe timeout in seconds.
                            format: int32
                            type: integer
                        type: object
                      readinessProbe:
                        description: ReadinessProbe configures model/tool/memory reachability
                          checks.
                        properties:
                          failureThreshold:
                            default: 3
                            description: FailureThreshold is the consecutive failures
                              before marking unready.
                            format: int32
                            type: integer
                          intervalSeconds:
                            default: 30
                            description: IntervalSeconds is how often (in seconds)
                              to perform the probe.
                            format: int32
                            type: integer
                          successThreshold:
                            default: 1
                            description: SuccessThreshold is the consecutive successes
                              to recover.
                            format: int32
                            type: integer
                          timeoutSeconds:
                            default: 10
                            description: TimeoutSeconds is the probe timeout in seconds.
                            format: int32
                            type: integer
                        type: object
                      reasoningProbe:
                        description: ReasoningProbe configures canary-task validation
                          checks.
                        properties:
                          canaryTask:
                            description: CanaryTask is the input prompt for the canary
                              evaluation.
                            type: string
                          expectedOutcome:
                            description: ExpectedOutcome is the exact UTF-8 output
                              the canary must return.
                            type: string
                          failureThreshold:
                            default: 2
                            description: FailureThreshold is the consecutive failures
                              before marking degraded.
                            format: int32
                            type: integer
                          intervalSeconds:
                            default: 300
                            description: IntervalSeconds is how often (in seconds)
                              to perform the probe.
                            format: int32
                            type: integer
                          maxInputTokens:
                            default: 4096
                            description: |-
                              MaxInputTokens is the maximum exact input-token count accepted for the
                              canary request.
                            format: int32
                            type: integer
                          maxTokens:
                            default: 256
                            description: MaxTokens is the token budget for the canary
                              run.
                            format: int32
                            type: integer
                          successThreshold:
                            default: 1
                            description: SuccessThreshold is the consecutive successes
                              to recover.
                            format: int32
                            type: integer
                          timeoutSeconds:
                            default: 60
                            description: TimeoutSeconds is the probe timeout in seconds.
                            format: int32
                            type: integer
                        required:
                        - canaryTask
                        - expectedOutcome
                        type: object
                    type: object
                  replicas:
                    default: 1
                    description: 'Replicas is the desired number of agent instances
                      (default: 1).'
                    format: int32
                    type: integer
                  restartLadder:
                    description: RestartLadder defines escalation responses when probes
                      fail.
                    properties:
                      steps:
                        description: Steps defines the escalation steps.
                        items:
                          description: RestartLadderStep defines a single escalation
                            response.
                          properties:
                            action:
                              description: Action is the response action to execute.
                              enum:
                              - Restart
                              - RollbackRevision
                              - DegradeModel
                              - Quarantine
                              - Alert
                              type: string
                            maxAttempts:
                              default: 1
                              description: |-
                                MaxAttempts is the maximum number of times this step can be tried
                                before escalating to the next step.
                              format: int32
                              type: integer
                            stabilisationSeconds:
                              default: 60
                              description: |-
                                StabilisationSeconds is how long to wait after this action before
                                deciding whether to escalate.
                              format: int32
                              type: integer
                          required:
                          - action
                          type: object
                        type: array
                    type: object
                  runtime:
                    description: Runtime configures execution runtime for this agent.
                    properties:
                      class:
                        description: Class selects the runtime adapter (e.g., "default",
                          "native", "autogen").
                        type: string
                      maxTokens:
                        description: MaxTokens is the maximum number of tokens per
                          invocation.
                        format: int64
                        type: integer
                      timeout:
                        description: Timeout is the maximum duration for a single
                          agent invocation.
                        type: string
                    type: object
                  tools:
                    description: Tools lists the tools available to this agent.
                    items:
                      description: AgentToolRef references a tool available to the
                        agent.
                      properties:
                        ref:
                          description: Ref names the Tool in the same namespace as
                            the Agent.
                          properties:
                            name:
                              description: Name is the name of the referenced resource.
                              type: string
                          required:
                          - name
                          type: object
                        required:
                          description: |-
                            Required, when true, causes the Agent to transition to not-ready
                            if the referenced Tool is not in the Ready phase.
                          type: boolean
                      required:
                      - ref
                      type: object
                    type: array
                required:
                - instructions
                - modelRef
                type: object
              backoffLimit:
                description: BackoffLimit is the number of retry attempts before marking
                  the job failed.
                format: int32
                type: integer
              completionPolicy:
                description: CompletionPolicy defines when the job is considered complete.
                enum:
                - Success
                - Any
                type: string
              input:
                description: Input is the one-shot task input payload.
                type: string
              memoryClaimRef:
                description: MemoryClaimRef binds this AgentJob to an existing MemoryClaim.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                required:
                - name
                type: object
            type: object
          status:
            description: AgentJobStatus describes the observed state of an AgentJob.
            properties:
              completionTime:
                description: CompletionTime records when the job entered a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failed:
                description: Failed is the number of failed one-shot executions.
                format: int32
                type: integer
              output:
                description: Output is the final output of a successful execution.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                type: string
              startTime:
                description: StartTime records when the selected execution attempt
                  started.
                format: date-time
                type: string
              succeeded:
                description: Succeeded is the number of successful one-shot executions.
                format: int32
                type: integer
              tokenUsage:
                description: TokenUsage reports token consumption from the successful
                  execution.
                properties:
                  completionTokens:
                    format: int64
                    type: integer
                  promptTokens:
                    format: int64
                    type: integer
                  totalTokens:
                    format: int64
                    type: integer
                type: object
              toolCalls:
                description: ToolCalls is the number of tool calls made by the successful
                  execution.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
