---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: workflows.kognition.dev
spec:
  group: kognition.dev
  names:
    kind: Workflow
    listKind: WorkflowList
    plural: workflows
    singular: workflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.entryPoints
      name: Entry
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workflow declares a multi-agent workflow DAG.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkflowSpec defines the desired state of a Workflow.
            properties:
              approvalGates:
                description: ApprovalGates define manual approval checkpoints before
                  selected steps.
                items:
                  description: WorkflowApprovalGate pauses execution on a specific
                    edge until approved.
                  properties:
                    from:
                      description: From is the source step of the edge requiring approval.
                      type: string
                    requiredApprovers:
                      description: |-
                        RequiredApprovers is the minimum number of distinct approvers needed
                        to open this gate. Zero or 1 means a single approval suffices.
                      format: int32
                      type: integer
                    timeout:
                      description: |-
                        Timeout is the maximum duration (e.g. "30m", "2h") the gate may remain
                        pending before being auto-rejected. Empty means no timeout.
                      type: string
                    to:
                      description: To is the destination step of the edge requiring
                        approval.
                      type: string
                  required:
                  - from
                  - to
                  type: object
                type: array
              budgets:
                description: Budgets enforce workflow-level resource limits.
                properties:
                  maxDuration:
                    description: MaxDuration is the maximum wall-clock time (e.g.
                      "30m").
                    type: string
                  maxIterations:
                    description: MaxIterations is the maximum number of step iterations.
                    format: int32
                    type: integer
                  maxTokens:
                    description: MaxTokens is the maximum total tokens for the workflow.
                    format: int64
                    type: integer
                  maxTokensPerCycle:
                    description: MaxTokensPerCycle is the maximum tokens per iteration
                      cycle.
                    format: int64
                    type: integer
                type: object
              continueOnError:
                description: |-
                  ContinueOnError allows the workflow to continue executing remaining parallel steps
                  when a step fails, rather than failing immediately.
                type: boolean
              edges:
                description: Edges defines directed transitions between steps.
                items:
                  description: WorkflowEdge defines a directed transition between
                    workflow steps.
                  properties:
                    condition:
                      description: Condition is a CEL expression for conditional transitions.
                      type: string
                    from:
                      description: From is the source step name.
                      type: string
                    to:
                      description: To is the destination step name.
                      type: string
                  required:
                  - from
                  - to
                  type: object
                type: array
              emergent:
                description: Emergent config enables planner-driven DAG mutation with
                  bounded budgets.
                properties:
                  budgets:
                    description: Budgets bounds planner-driven DAG mutations.
                    properties:
                      maxCost:
                        description: MaxCost is the maximum cost budget (e.g. "$0.50").
                        type: string
                      maxSteps:
                        description: MaxSteps is the maximum number of emergent steps
                          the planner may add.
                        format: int32
                        type: integer
                      maxTokens:
                        description: MaxTokens is the maximum tokens the planner may
                          spend on emergent steps.
                        format: int64
                        type: integer
                    type: object
                  enabled:
                    description: Enabled activates emergent behavior.
                    type: boolean
                type: object
              entryPoint:
                description: EntryPoint is the name of the first step.
                type: string
              failFast:
                description: FailFast causes the workflow to cancel all pending steps
                  immediately when any step fails.
                type: boolean
              historyLimit:
                description: |-
                  HistoryLimit is the maximum number of completed WorkflowRuns to retain.
                  0 (default) means no limit.
                format: int32
                type: integer
              maxConcurrentRuns:
                description: |-
                  MaxConcurrentRuns limits the number of WorkflowRuns that may execute
                  concurrently for this Workflow. 0 (default) means unlimited.
                format: int32
                type: integer
              maxParallelSteps:
                description: |-
                  MaxParallelSteps limits the number of steps that can run concurrently.
                  0 (default) means unlimited parallelism.
                format: int32
                type: integer
              memoryClaim:
                description: |-
                  MemoryClaim, when set, causes the WorkflowRunReconciler to materialize a
                  per-run MemoryClaim shared across every step in the run.
                properties:
                  accessMode:
                    description: AccessMode is the requested access mode for the claim.
                    type: string
                  memoryClassName:
                    description: MemoryClassName references the MemoryClass that backs
                      the claim.
                    type: string
                required:
                - memoryClassName
                type: object
              memoryRetentionPolicy:
                description: |-
                  MemoryRetentionPolicy controls the fate of the per-run MemoryClaim when
                  the WorkflowRun reaches a terminal phase. Defaults to Delete.
                enum:
                - Delete
                - Retain
                type: string
              parameters:
                additionalProperties:
                  type: string
                description: Parameters are user-supplied key-value pairs available
                  to step input templates.
                type: object
              steps:
                description: Steps defines the workflow steps (agent invocations).
                items:
                  description: |-
                    WorkflowStep defines a single step in a workflow DAG.
                    Steps are pure execution nodes; all topology is expressed through Edges.
                  properties:
                    agentRef:
                      description: |-
                        AgentRef references the Agent to invoke for this step.
                        Required when type="agent"; optional when type="tool" (acts as the
                        identity principal for ToolGrant evaluation when present).
                      properties:
                        name:
                          description: Name is the name of the referenced resource.
                          type: string
                      required:
                      - name
                      type: object
                    collaboration:
                      description: |-
                        Collaboration configures the step when type="collaboration" and must be
                        empty for every other type.
                      properties:
                        allowedInteractions:
                          description: |-
                            AllowedInteractions lists the delegation requests members may make. It does
                            not replace communication policy or add Workflow dependency edges.
                          items:
                            description: CollaborationInteraction permits one member
                              to delegate to another.
                            properties:
                              from:
                                pattern: ^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$
                                type: string
                              to:
                                pattern: ^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$
                                type: string
                            required:
                            - from
                            - to
                            type: object
                          maxItems: 56
                          type: array
                        guidance:
                          description: |-
                            Guidance is author-written text on how the team should resolve the task, for
                            example the order of work or what each member should check. Every member
                            receives it as trusted instructions. It guides the members; it does not
                            grant or restrict interactions, which allowedInteractions controls.
                          maxLength: 2000
                          type: string
                        handoff:
                          description: CollaborationHandoff configures the Handoff
                            strategy.
                          properties:
                            entryMember:
                              description: EntryMember is the first owner.
                              pattern: ^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$
                              type: string
                            maxHandoffs:
                              description: MaxHandoffs bounds ownership transfers.
                                It cannot exceed limits.maxDelegations.
                              format: int32
                              maximum: 100
                              minimum: 1
                              type: integer
                          required:
                          - entryMember
                          - maxHandoffs
                          type: object
                        limits:
                          description: Limits bounds the step. Every field is required
                            and finite.
                          properties:
                            maxContentBytes:
                              description: User-defined UTF-8 byte limit for each input, goal, handoff context and result.
                              format: int64
                              minimum: 1
                              type: integer
                            maxDelegationDepth:
                              format: int32
                              maximum: 5
                              minimum: 1
                              type: integer
                            maxDelegations:
                              format: int32
                              maximum: 100
                              minimum: 1
                              type: integer
                            maxMessages:
                              format: int32
                              maximum: 500
                              minimum: 1
                              type: integer
                            maxParallelTasks:
                              format: int32
                              maximum: 8
                              minimum: 1
                              type: integer
                            maxTokens:
                              format: int64
                              minimum: 1
                              type: integer
                            maxTurns:
                              format: int32
                              maximum: 100
                              minimum: 1
                              type: integer
                          required:
                          - maxContentBytes
                          - maxDelegationDepth
                          - maxDelegations
                          - maxMessages
                          - maxParallelTasks
                          - maxTokens
                          - maxTurns
                          type: object
                        members:
                          description: Members are the participating Agents, addressed
                            by step-local alias.
                          items:
                            description: CollaborationMember binds a step-local alias
                              to an Agent or to an ExternalAgent.
                            properties:
                              agentRef:
                                description: AgentRef references the member Agent.
                                properties:
                                  name:
                                    description: Name is the Agent name.
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                  namespace:
                                    description: Namespace is the Agent namespace.
                                      An empty value means the Workflow namespace.
                                    maxLength: 63
                                    type: string
                                required:
                                - name
                                type: object
                              description:
                                description: |-
                                  Description states what the member is good at. Members that may involve this
                                  member see it when choosing whom to delegate to, and the member sees it as
                                  its own role. An ExternalAgent member without a description is described by
                                  the skills pinned on its ExternalAgent.
                                maxLength: 500
                                type: string
                              externalAgentRef:
                                description: |-
                                  ExternalAgentRef references a remote A2A agent declared by an ExternalAgent in
                                  the Workflow namespace. Data sent to it leaves the platform, so an
                                  ExternalAgentGrant is required.
                                properties:
                                  name:
                                    description: Name is the name of the referenced
                                      resource.
                                    type: string
                                required:
                                - name
                                type: object
                              name:
                                description: Name is the stable step-local alias.
                                pattern: ^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$
                                type: string
                              serviceRef:
                                description: |-
                                  ServiceRef optionally pins one AgentService, in the Agent namespace, when
                                  the Agent has several serving configurations. It is not valid with externalAgentRef.
                                properties:
                                  name:
                                    description: Name is the name of the referenced
                                      resource.
                                    type: string
                                required:
                                - name
                                type: object
                            required:
                            - name
                            type: object
                            x-kubernetes-validations:
                            - message: exactly one of agentRef and externalAgentRef
                                is required
                              rule: has(self.agentRef) != has(self.externalAgentRef)
                            - message: serviceRef is not valid with externalAgentRef
                              rule: '!has(self.externalAgentRef) || !has(self.serviceRef)'
                          maxItems: 8
                          minItems: 2
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        parallel:
                          description: CollaborationParallel configures the Parallel
                            strategy.
                          properties:
                            branches:
                              description: Branches are the members that run concurrently.
                              items:
                                description: CollaborationBranch is one parallel branch.
                                properties:
                                  member:
                                    description: Member is the member alias that runs
                                      the branch.
                                    pattern: ^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$
                                    type: string
                                  optional:
                                    description: |-
                                      Optional branches may fail without failing the step. They are recorded in
                                      the result manifest.
                                    type: boolean
                                required:
                                - member
                                type: object
                              maxItems: 8
                              minItems: 2
                              type: array
                            synthesizer:
                              description: Synthesizer optionally combines the branch
                                results. It must not be a branch.
                              pattern: ^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$
                              type: string
                          required:
                          - branches
                          type: object
                        peer:
                          description: CollaborationPeer configures the Peer strategy.
                          properties:
                            finalizer:
                              description: Finalizer is the only member that can complete
                                the step.
                              pattern: ^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$
                              type: string
                          required:
                          - finalizer
                          type: object
                        protocol:
                          description: Protocol selects the inter-agent protocol profile.
                          enum:
                          - A2A
                          type: string
                        strategy:
                          description: |-
                            Strategy selects the coordination strategy. Exactly the matching strategy
                            block must be present.
                          enum:
                          - Supervisor
                          - Parallel
                          - Handoff
                          - Peer
                          type: string
                        supervisor:
                          description: CollaborationSupervisor configures the Supervisor
                            strategy.
                          properties:
                            coordinator:
                              description: Coordinator is the member alias that delegates
                                and produces the final artifact.
                              pattern: ^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$
                              type: string
                          required:
                          - coordinator
                          type: object
                      required:
                      - limits
                      - members
                      - protocol
                      - strategy
                      type: object
                      x-kubernetes-validations:
                      - message: supervisor is required exactly when strategy is Supervisor
                        rule: (self.strategy == 'Supervisor') == has(self.supervisor)
                      - message: parallel is required exactly when strategy is Parallel
                        rule: (self.strategy == 'Parallel') == has(self.parallel)
                      - message: handoff is required exactly when strategy is Handoff
                        rule: (self.strategy == 'Handoff') == has(self.handoff)
                      - message: peer is required exactly when strategy is Peer
                        rule: (self.strategy == 'Peer') == has(self.peer)
                    condition:
                      description: |-
                        Condition is a CEL expression that gates step dispatch.
                        If present and evaluates to false, the step is set to Skipped.
                      type: string
                    continueOnError:
                      description: ContinueOnError allows this step to fail without
                        failing the workflow.
                      type: boolean
                    input:
                      description: Input is the input to the agent for this step.
                      type: string
                    memoryClaim:
                      description: MemoryClaim overrides the workflow-level MemoryClaim
                        for this step.
                      properties:
                        accessMode:
                          description: AccessMode is the requested access mode for
                            the claim.
                          type: string
                        memoryClassName:
                          description: MemoryClassName references the MemoryClass
                            that backs the claim.
                          type: string
                      required:
                      - memoryClassName
                      type: object
                    name:
                      description: Name is the unique step identifier within this
                        workflow.
                      type: string
                    retry:
                      description: Retry configures retry behavior for this step.
                      properties:
                        backoff:
                          description: Backoff is the backoff duration between retries
                            (e.g. "10s").
                          type: string
                        backoffMultiplier:
                          description: BackoffMultiplier scales backoff exponentially
                            per attempt. Default 2.0.
                          type: number
                        maxAttempts:
                          description: |-
                            MaxAttempts is the maximum total number of attempts (initial + retries).
                            Values <= 1 disable retry; the step is attempted at most once.
                          format: int32
                          type: integer
                        maxBackoff:
                          description: MaxBackoff caps the computed backoff duration
                            (e.g. "1m").
                          type: string
                      type: object
                    timeout:
                      description: Timeout is the maximum duration for this step (e.g.
                        "5m").
                      type: string
                    toolRef:
                      description: |-
                        ToolRef references the Tool to invoke for this step.
                        Required when type="tool"; must be empty when type="agent".
                      properties:
                        name:
                          description: Name is the name of the referenced resource.
                          type: string
                      required:
                      - name
                      type: object
                    type:
                      description: Type selects the dispatch mechanism for this step.
                        Defaults to "agent".
                      enum:
                      - agent
                      - tool
                      - collaboration
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: collaboration is required exactly when type is collaboration
                    rule: (has(self.type) && self.type == 'collaboration') == has(self.collaboration)
                type: array
            required:
            - steps
            type: object
          status:
            description: WorkflowStatus describes the observed state of a Workflow.
            properties:
              activeStep:
                description: ActiveStep is the name of the currently executing step.
                type: string
              activeSteps:
                description: ActiveSteps lists the names of concurrently executing
                  steps.
                items:
                  type: string
                type: array
              completedSteps:
                description: CompletedSteps lists the names of steps that have finished.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              entryPoints:
                description: |-
                  EntryPoints lists the step names where execution starts: spec.entryPoint
                  when set, otherwise every step without an incoming edge.
                items:
                  type: string
                type: array
              phase:
                description: Phase is the current lifecycle phase.
                type: string
              stepStatuses:
                description: StepStatuses reports the status of individual workflow
                  steps.
                items:
                  description: WorkflowStepStatus reports the status of an individual
                    workflow step.
                  properties:
                    attempts:
                      description: Attempts is the number of execution attempts for
                        this step.
                      format: int32
                      type: integer
                    name:
                      description: Name is the step identifier.
                      type: string
                    nextRetryAt:
                      description: NextRetryAt is the time at which the next retry
                        is eligible to dispatch.
                      format: date-time
                      type: string
                    output:
                      description: Output is the step's output.
                      type: string
                    phase:
                      description: Phase is the step's current phase.
                      type: string
                    startedAt:
                      description: StartedAt is the time the current attempt started.
                      format: date-time
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
