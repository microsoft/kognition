---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: knowledgebaseindexruns.kognition.dev
spec:
  group: kognition.dev
  names:
    kind: KnowledgeBaseIndexRun
    listKind: KnowledgeBaseIndexRunList
    plural: knowledgebaseindexruns
    shortNames: [kbrun]
    singular: knowledgebaseindexrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.knowledgeBaseName
      name: KnowledgeBase
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.jobName
      name: Job
      type: string
    - jsonPath: .status.documentCount
      name: Docs
      type: integer
    - jsonPath: .status.indexedChunks
      name: Chunks
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        required: [spec]
        description: KnowledgeBaseIndexRun is a one-shot request to reindex a KnowledgeBase.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KnowledgeBaseIndexRunSpec describes what a single indexing
              run should do.
            properties:
              knowledgeBaseName:
                description: |-
                  KnowledgeBaseName references the KnowledgeBase in the same namespace to
                  reindex.
                type: string
              ttlSecondsAfterFinished:
                minimum: 0
                description: |-
                  TTLSecondsAfterFinished, when set, causes the reconciler to delete the
                  IndexRun this many seconds after it enters a terminal phase.
                format: int32
                type: integer
            required:
            - knowledgeBaseName
            type: object
          status:
            description: KnowledgeBaseIndexRunStatus reports the observed state of
              an indexing run.
            properties:
              backendBinding:
                description: |-
                  BackendBinding is the provider's immutable confirmation of the indexed
                  generation.
                properties:
                  backendOperationID:
                    maxLength: 1024
                    minLength: 1
                    type: string
                  classGeneration:
                    format: int64
                    minimum: 1
                    type: integer
                  classUID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  configurationAPIGroup:
                    maxLength: 253
                    minLength: 1
                    type: string
                  configurationDigest:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  configurationKind:
                    maxLength: 63
                    minLength: 1
                    type: string
                  configurationName:
                    maxLength: 253
                    minLength: 1
                    type: string
                  configurationUID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  embeddingModelBinding:
                    type: object
                    properties:
                      namespace:
                        type: string
                        minLength: 1
                      modelName:
                        type: string
                        minLength: 1
                      modelUID:
                        type: string
                        minLength: 1
                      modelResourceVersion:
                        type: integer
                        format: int64
                        minimum: 1
                      specDigest:
                        type: string
                        pattern: ^sha256:[a-f0-9]{64}$
                      invocationProfileUID:
                        type: string
                      invocationProfileDigest:
                        type: string
                    required:
                    - namespace
                    - modelName
                    - modelUID
                    - modelResourceVersion
                    - specDigest
                  generation:
                    format: int64
                    minimum: 1
                    type: integer
                  operationID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  providerName:
                    maxLength: 253
                    minLength: 1
                    type: string
                  reclaimPolicy:
                    description: ReclaimPolicy defines what happens to memory data
                      when the claim is deleted.
                    enum:
                    - Delete
                    - Retain
                    - Archive
                    type: string
                required:
                - backendOperationID
                - classGeneration
                - classUID
                - configurationAPIGroup
                - configurationDigest
                - configurationKind
                - configurationName
                - configurationUID
                - generation
                - operationID
                - providerName
                type: object
              completedAt:
                description: |-
                  CompletedAt is the RFC 3339 timestamp when the run reached a terminal
                  phase.
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              documentCount:
                description: DocumentCount is the number of documents processed by
                  the run.
                format: int64
                type: integer
              indexedChunks:
                description: |-
                  IndexedChunks is the number of chunks written to the vector index by
                  the run.
                format: int64
                type: integer
              jobName:
                description: |-
                  JobName is the name of the underlying batch/v1 Job in the KB's
                  namespace.
                type: string
              message:
                description: Message is a human-readable summary of the terminal state.
                type: string
              phase:
                description: Phase is Pending | Running | Succeeded | Failed.
                type: string
              sourceDigest:
                description: |-
                  SourceDigest identifies the version of the source data that was
                  indexed.
                type: string
              startedAt:
                description: StartedAt is the RFC 3339 timestamp when the run entered
                  Running.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
