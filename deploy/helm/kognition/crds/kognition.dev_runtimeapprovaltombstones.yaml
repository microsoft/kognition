    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RuntimeApprovalTombstone is the bounded replay fence retained after a
          terminal RuntimeApproval is compacted. It deliberately excludes action
          payloads, credentials, decision actors, and unbounded evidence.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              agentRef:
                properties:
                  kind:
                    enum: [Agent]
                    maxLength: 64
                    minLength: 1
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    maxLength: 253
                    minLength: 1
                    type: string
                  resourceVersion:
                    format: int64
                    minimum: 1
                    type: integer
                  scope:
                    enum:
                    - Namespaced
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                - resourceVersion
                - scope
                - uid
                type: object
              binding:
                properties:
                  algorithm:
                    enum:
                    - HMAC-SHA-256
                    type: string
                  domain:
                    enum:
                    - kognition.dev/runtime-approval/action/v1
                    - kognition.dev/workflow-executor/action/v1
                    type: string
                  epoch:
                    format: int64
                    minimum: 1
                    type: integer
                  format:
                    enum:
                    - kognition-runtime-action-v1
                    - kognition-workflow-executor-action-v1
                    type: string
                  keyVersion:
                    format: int64
                    minimum: 1
                    type: integer
                  tag:
                    maxLength: 64
                    minLength: 43
                    type: string
                required:
                - algorithm
                - domain
                - epoch
                - format
                - keyVersion
                - tag
                type: object
              compactedAt:
                format: date-time
                type: string
              actorKind:
                type: string
                enum: [WorkflowExecutor]
              executorAction:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                required: [executor, initiator, workflow, workflowRevisionDigest, executionBinding, target, service, context, expiresAt]
                properties:
                  executor: &tombstonePrincipal
