            - message: replay fence must preserve its actual Agent or executor actor
              rule: "has(self.actorKind) ? (has(self.executorAction) && has(self.workflowContext) && !has(self.agentRef) && self.plane == 'Workflow') : (has(self.agentRef) && !has(self.executorAction) && self.plane != 'Workflow' && self.agentRef.kind == 'Agent' && self.agentRef.scope == 'Namespaced' && self.agentRef.__namespace__ == self.workspace)"
            - message: replay fence domain must preserve its actual actor type
              rule: "has(self.actorKind) ? (self.binding.format == 'kognition-workflow-executor-action-v1' && self.binding.domain == 'kognition.dev/workflow-executor/action/v1' && self.workspace == self.executorAction.context.workspace && self.expiresAt <= self.executorAction.expiresAt) : (self.binding.format == 'kognition-runtime-action-v1' && self.binding.domain == 'kognition.dev/runtime-approval/action/v1')"
            - message: compactedAt must not precede createdAt
              rule: self.compactedAt >= self.createdAt
            - message: retentionDeadline must follow compactedAt
              rule: self.retentionDeadline > self.compactedAt
            - message: decision and execution states must describe a terminal action
              rule: 'self.decisionState in [''Rejected'', ''Expired''] ? self.executionState
                == ''NotStarted'' : self.executionState in [''Completed'', ''Failed'']'
            - message: only terminal execution states require an execution disposition
              rule: 'self.executionState == ''NotStarted'' ? !has(self.executionDisposition)
                : has(self.executionDisposition)'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: RuntimeApprovalTombstone spec is immutable
          rule: self.spec == oldSelf.spec
