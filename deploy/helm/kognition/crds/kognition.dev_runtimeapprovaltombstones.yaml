                    x-kubernetes-preserve-unknown-fields: true
                    required: [method, issuer, subject]
                    properties:
                      method: {type: string, minLength: 1, maxLength: 64}
                      issuer: {type: string, minLength: 1, maxLength: 512}
                      subject: {type: string, minLength: 1, maxLength: 512}
                    x-kubernetes-validations:
                    - rule: "!(self.method in ['anonymous', 'token'])"
                      message: "executor replay requires canonical non-bootstrap attribution"
                  initiator: *tombstonePrincipal
                  workflow: &tombstoneExecutorReference
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    required: [kind, scope, namespace, name, uid, resourceVersion]
                    properties:
                      kind: {type: string, minLength: 1, maxLength: 64}
                      scope: {type: string, enum: [Namespaced]}
                      namespace: {type: string, minLength: 1, maxLength: 63}
                      name: {type: string, minLength: 1, maxLength: 253}
                      uid: {type: string, minLength: 1, maxLength: 128}
                      resourceVersion: {type: integer, format: int64, minimum: 1}
                  workflowRevisionDigest:
                    type: string
                    minLength: 64
                    maxLength: 64
                    pattern: '^[a-f0-9]{64}$'
                  executionBinding: *tombstoneExecutorReference
                  target: *tombstoneExecutorReference
                  service: *tombstoneExecutorReference
                  context: &tombstoneActivationContext
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    required: [workspace, runUID, step, activationID, attempt, ownerEpoch, bindingDigest]
                    properties:
                      workspace:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      runUID: {type: string, minLength: 1, maxLength: 128}
                      step: {type: string, minLength: 1, maxLength: 128}
                      activationID: {type: string, minLength: 1, maxLength: 128}
                      attempt: {type: integer, format: int64, minimum: 1}
                      ownerEpoch: {type: integer, format: int64, minimum: 1}
                      bindingDigest:
                        type: string
                        minLength: 64
                        maxLength: 64
                        pattern: '^[a-f0-9]{64}$'
                  expiresAt: {type: string, format: date-time}
              workflowContext: *tombstoneActivationContext
              createdAt:
