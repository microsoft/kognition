  names:
    kind: RuntimeApprovalTombstone
    listKind: RuntimeApprovalTombstoneList
    plural: runtimeapprovaltombstones
    singular: runtimeapprovaltombstone
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.decisionState
      name: Decision
      type: string
    - jsonPath: .spec.executionState
      name: Execution
      type: string
    - jsonPath: .spec.retentionDeadline
      name: Retain Until
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
