              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              agentRef:
                properties:
                  kind:
                    enum: [Agent]
                    maxLength: 64
                    minLength: 1
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    maxLength: 253
                    minLength: 1
                    type: string
                  resourceVersion:
                    format: int64
                    minimum: 1
