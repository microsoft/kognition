                - ReceiptConflict
                - PolicyChanged
                - TargetChanged
                - SessionChanged
                - PreparationRejected
                - ApprovalExpiredBeforeClaim
                - AbandonedPreparation
                - ReconciledCompleted
                - ReconciledNotExecuted
                - Succeeded
                - Failed
                type: string
              executionState:
                enum:
                - NotStarted
                - Completed
                - Failed
                type: string
              expiresAt:
                format: date-time
                type: string
              initialDecision:
                enum:
                - Pending
                - NotRequired
                type: string
              invocationID:
                maxLength: 128
                minLength: 1
                type: string
              operation:
                maxLength: 128
                minLength: 1
