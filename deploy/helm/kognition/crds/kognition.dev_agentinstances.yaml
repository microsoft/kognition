---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agentinstances.kognition.dev
spec:
  group: kognition.dev
  names:
    kind: AgentInstance
    listKind: AgentInstanceList
    plural: agentinstances
    singular: agentinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef.name
      name: Agent
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentInstance represents a running instance of an Agent.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentInstanceSpec defines the desired state of an AgentInstance.
            properties:
              agentRef:
                description: AgentRef references the parent Agent.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                required:
                - name
                type: object
              agentRevision:
                description: |-
                  AgentRevision optionally selects an immutable Agent configuration for
                  dispatch. It is distinct from Revision, which identifies the instance.
                format: int64
                type: integer
              revision:
                description: Revision is the Agent revision this instance was created
                  from.
                format: int64
                type: integer
              sessionContext:
                additionalProperties:
                  type: string
                description: SessionContext carries caller-supplied context for this
                  instance's session.
                type: object
            required:
            - agentRef
            - revision
            type: object
          status:
            description: AgentInstanceStatus describes the observed state of an AgentInstance.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dispatchAttempts:
                description: DispatchAttempts counts scheduling attempts for this
                  instance.
                format: int32
                type: integer
              output:
                description: Output is the final output of the agent instance.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                type: string
              probeStatus:
                description: ProbeStatus tracks the observed probe state.
                properties:
                  consecutiveHealthFailures:
                    description: ConsecutiveHealthFailures counts consecutive health
                      probe failures.
                    format: int32
                    type: integer
                  consecutiveHealthSuccesses:
                    description: ConsecutiveHealthSuccesses counts consecutive health
                      probe successes.
                    format: int32
                    type: integer
                  consecutiveReadinessFailures:
                    description: ConsecutiveReadinessFailures counts consecutive readiness
                      probe failures.
                    format: int32
                    type: integer
                  consecutiveReadinessSuccesses:
                    description: ConsecutiveReadinessSuccesses counts consecutive
                      readiness probe successes.
                    format: int32
                    type: integer
                  consecutiveReasoningFailures:
                    description: ConsecutiveReasoningFailures counts consecutive reasoning
                      probe failures.
                    format: int32
                    type: integer
                  consecutiveReasoningSuccesses:
                    description: ConsecutiveReasoningSuccesses counts consecutive
                      reasoning probe successes.
                    format: int32
                    type: integer
                  healthy:
                    description: Healthy indicates whether the health probe is passing.
                    type: boolean
                  ladderAttempts:
                    description: LadderAttempts is the number of attempts at the current
                      ladder step.
                    format: int32
                    type: integer
                  ladderStep:
                    description: LadderStep is the current position in the restart
                      ladder (0-indexed).
                    format: int32
                    type: integer
                  lastLadderAction:
                    description: LastLadderAction records the last restart-ladder
                      action executed.
                    enum:
                    - Restart
                    - RollbackRevision
                    - DegradeModel
                    - Quarantine
                    - Alert
                    type: string
                  lastProbeTime:
                    description: LastProbeTime records when probes were last executed.
                    type: string
                  lastReasoningResult:
                    description: LastReasoningResult is the metadata-only terminal
                      canary result.
                    properties:
                      actualBytes:
                        format: int32
                        type: integer
                      actualSHA256:
                        type: string
                      closedReason:
                        description: CanaryFailureReason is the closed set of reasoning
                          canary failure reasons.
                        enum:
                        - InvalidConfiguration
                        - BindingChanged
                        - AuthorizationDenied
                        - BudgetDenied
                        - TimedOut
                        - ProviderFailed
                        - ToolCallRequested
                        - InvalidEncoding
                        - OutputLimitExceeded
                        - AccountingUncertain
                        - PersistenceFailed
                        type: string
                      completionTokens:
                        format: int64
                        type: integer
                      expectedBytes:
                        format: int32
                        type: integer
                      expectedSHA256:
                        type: string
                      operationID:
                        type: string
                      outcome:
                        description: CanaryOutcome is the closed set of terminal reasoning
                          canary outcomes.
                        enum:
                        - Passed
                        - OutcomeMismatch
                        - ExecutionFailed
                        type: string
                      promptTokens:
                        format: int64
                        type: integer
                      providerDurationMillis:
                        format: int64
                        type: integer
                      spanID:
                        type: string
                      totalTokens:
                        format: int64
                        type: integer
                      traceID:
                        type: string
                    required:
                    - operationID
                    - outcome
                    type: object
                    x-kubernetes-validations:
                    - message: closedReason is required only when outcome is ExecutionFailed
                      rule: (self.outcome == 'ExecutionFailed') == has(self.closedReason)
                  lastReasoningScheduleSlot:
                    description: |-
                      LastReasoningScheduleSlot is the canonical boundary owned by the current
                      or most recently completed reasoning canary.
                    type: string
                  ready:
                    description: Ready indicates whether the readiness probe is passing.
                    type: boolean
                  reasoningBindings:
                    description: |-
                      ReasoningBindings records the versioned, non-secret resources used by the
                      current or most recently completed reasoning canary.
                    items:
                      description: |-
                        CanaryResourceBinding identifies one immutable execution dependency without
                        persisting its content.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        resourceVersion:
                          type: string
                        revision:
                          format: int64
                          type: integer
                        uid:
                          type: string
                      required:
                      - kind
                      - name
                      - namespace
                      - uid
                      type: object
                    type: array
                  reasoningHealthy:
                    description: ReasoningHealthy indicates whether the reasoning
                      probe is passing.
                    type: boolean
                  reasoningOperationID:
                    description: |-
                      ReasoningOperationID is the deterministic operation identity for the
                      last reasoning schedule slot.
                    type: string
                  reasoningRequestDigest:
                    description: ReasoningRequestDigest binds every execution-affecting
                      request field.
                    type: string
                  rolledBackToRevision:
                    description: RolledBackToRevision records which agent revision
                      was rolled back to.
                    format: int64
                    type: integer
                type: object
              restartCount:
                description: RestartCount is how many times this instance has been
                  restarted.
                format: int32
                type: integer
              sessionID:
                description: SessionID is the active session identifier.
                type: string
              startTime:
                description: StartTime is when the instance started.
                format: date-time
                type: string
              tokenUsage:
                description: TokenUsage reports token consumption.
                properties:
                  completionTokens:
                    format: int64
                    type: integer
                  promptTokens:
                    format: int64
                    type: integer
                  totalTokens:
                    format: int64
                    type: integer
                type: object
              toolCalls:
                description: ToolCalls is the number of tool calls made.
                format: int32
                type: integer
              toolCallsDetail:
                description: ToolCallsDetail records the bounded inputs and result
                  of each tool call.
                items:
                  description: ToolCallDetail records the bounded inputs and result
                    of one runtime tool call.
                  properties:
                    args:
                      description: Args is the JSON-encoded tool input for the call.
                      type: string
                    durationMs:
                      description: DurationMS is the execution duration in milliseconds.
                      format: int64
                      type: integer
                    error:
                      description: Error describes an execution failure, when present.
                      type: string
                    name:
                      description: Name is the Tool name selected by the model.
                      type: string
                    result:
                      description: Result is the JSON-encoded tool output for the
                        call.
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
