---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: models.kognition.dev
spec:
  group: kognition.dev
  names:
    kind: Model
    listKind: ModelList
    plural: models
    singular: model
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.className
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Model declares an LLM or embedding model available for inference.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelSpec defines the desired state of a Model.
            properties:
              capabilities:
                description: Capabilities describes supported workloads (chat, embedding,
                  tool-calling, vision).
                items:
                  type: string
                type: array
              className:
                description: ClassName references the ModelClass provisioner.
                type: string
              credentialRef:
                description: CredentialRef references the SecretRef containing API
                  credentials.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                required:
                - name
                type: object
              endpoint:
                description: Endpoint is the provider endpoint used for health checks
                  and inference routing.
                type: string
              modelID:
                description: ModelID is the provider-specific model identifier (e.g.,
                  "gpt-4o", "claude-3.5-sonnet").
                type: string
              invocationProfileRef:
                type: object
                required: [name, specDigest]
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                  specDigest:
                    type: string
                    pattern: '^sha256:[0-9a-f]{64}$'
              invocationContract:
                type: string
                minLength: 1
                maxLength: 128
              parameters:
                additionalProperties:
                  type: string
                description: Parameters are model-specific settings (temperature,
                  max_tokens, apiVersion, etc.).
                type: object
              provider:
                description: |-
                  Provider identifies the model backend provider.
                  Supported values include "openai-compatible", "azure-openai", and "foundry".
                type: string
              rateLimit:
                description: RateLimit is the provider call budget (requests per minute).
                format: int64
                type: integer
              signature:
                description: Signature is a cosign-compatible supply-chain signature
                  for verification.
                type: string
            required:
            - className
            - modelID
            type: object
            x-kubernetes-validations:
            - rule: has(self.invocationProfileRef) == has(self.invocationContract)
              message: invocationProfileRef and invocationContract must be configured together
          status:
            description: ModelStatus describes the observed state of a Model.
            properties:
              available:
                description: Available indicates the model endpoint is reachable.
                type: boolean
              capabilities:
                description: Capabilities lists capabilities confirmed by the provider.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastCheck:
                description: LastCheck is the RFC3339 timestamp of the last health
                  check.
                type: string
              latency:
                description: Latency is the last observed latency string (e.g., "120ms").
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
