---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: externalagents.kognition.dev
spec:
  group: kognition.dev
  names:
    kind: ExternalAgent
    listKind: ExternalAgentList
    plural: externalagents
    singular: externalagent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.protocol
      name: Protocol
      type: string
    - jsonPath: .spec.endpoint
      name: Endpoint
      type: string
    - jsonPath: .spec.card.digest
      name: Card
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ExternalAgent is a remote agent reachable over A2A that a Workflow can use as
          a collaboration member or step target. It is a trust boundary: it is never
          run, scaled or metered by the platform.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ExternalAgentSpec defines the remote endpoint, its pinned card and limits.
              Protocol, endpoint, card digest and credential reference are immutable; a new
              endpoint, card or credential is a new resource.
            properties:
              card:
                description: Card pins the Agent Card the platform will accept.
                properties:
                  digest:
                    description: |-
                      Digest is "sha256:" plus the lowercase hex SHA-256 of the RFC 8785
                      canonical form of the Agent Card with its signatures removed.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  skills:
                    description: Skills optionally restricts the card skills the platform
                      will use.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                required:
                - digest
                type: object
              credentialRef:
                description: CredentialRef names a SecretRef in the same namespace
                  holding a bearer token.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                required:
                - name
                type: object
              endpoint:
                description: |-
                  Endpoint is a static DNS host:port. TLS is always used. IP literals,
                  schemes, userinfo and paths are rejected.
                maxLength: 260
                minLength: 3
                pattern: ^[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?(\.[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?)+\.?:[0-9]{1,5}$
                type: string
              limits:
                description: Limits bound every task sent to the agent. Unset values
                  take defaults.
                properties:
                  maxConcurrentTasks:
                    format: int32
                    maximum: 16
                    minimum: 0
                    type: integer
                  maxRequestBytes:
                    format: int64
                    maximum: 1048576
                    minimum: 0
                    type: integer
                  maxResponseBytes:
                    format: int64
                    maximum: 4194304
                    minimum: 0
                    type: integer
                  maxTokensPerTask:
                    format: int64
                    maximum: 131072
                    minimum: 0
                    type: integer
                  taskTimeout:
                    description: TaskTimeout is a Go duration between 1s and 30m.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                type: object
              protocol:
                description: Protocol is required. Only A2A is supported in v1.
                enum:
                - A2A
                type: string
            required:
            - card
            - credentialRef
            - endpoint
            - protocol
            type: object
            x-kubernetes-validations:
            - message: protocol, endpoint, card.digest and credentialRef are immutable
              rule: self.protocol == oldSelf.protocol && self.endpoint == oldSelf.endpoint
                && self.card.digest == oldSelf.card.digest && self.credentialRef.name
                == oldSelf.credentialRef.name
          status:
            description: ExternalAgentStatus is the observed state of an ExternalAgent.
            properties:
              conditions:
                description: Conditions are Ready, CardPinned, Reachable and EgressAllowed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedCardDigest:
                description: ObservedCardDigest is the digest of the card last fetched
                  from the endpoint.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
