suite: Regression tests for fixed bugs
templates:
  - templates/_helpers.tpl
  - templates/k8s-controller-deployment.yaml
  - templates/webhook-service.yaml
  - templates/webhook-certificate.yaml
  - templates/validating-webhook-configuration.yaml
  - templates/mutating-webhook-configuration.yaml
  - templates/apiserver-deployment.yaml
  - templates/controller-manager-deployment.yaml
  - templates/NOTES.txt
tests:
  # ============================================================
  # Bug #1: kognition.labels helper must include app.kubernetes.io/name
  # Previously the helper was missing this label entirely.
  # ============================================================
  - it: "Bug#1 - kognition.labels should produce app.kubernetes.io/name"
    template: templates/k8s-controller-deployment.yaml
    set:
      mode: kubernetes
    asserts:
      - isNotNull:
          path: metadata.labels["app.kubernetes.io/name"]
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: kognition

  # ============================================================
  # Bug #2: k8s-controller had redundant explicit app.kubernetes.io/name
  # The pod template should only get name from kognition.labels, not duplicated.
  # We verify the label exists exactly once (from kognition.labels helper).
  # ============================================================
  - it: "Bug#2 - k8s-controller pod template has name label from shared helper"
    template: templates/k8s-controller-deployment.yaml
    set:
      mode: kubernetes
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: kognition
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: kognition

  # ============================================================
  # Bug #3: Webhook templates must NOT render in standalone mode.
  # Previously they rendered regardless of mode.
  # ============================================================
  - it: "Bug#3 - webhook-service does NOT render in standalone mode"
    template: templates/webhook-service.yaml
    set:
      mode: standalone
    asserts:
      - hasDocuments:
          count: 0

  - it: "Bug#3 - validating-webhook does NOT render in standalone mode"
    template: templates/validating-webhook-configuration.yaml
    set:
      mode: standalone
    asserts:
      - hasDocuments:
          count: 0

  - it: "Bug#3 - mutating-webhook does NOT render in standalone mode"
    template: templates/mutating-webhook-configuration.yaml
    set:
      mode: standalone
    asserts:
      - hasDocuments:
          count: 0

  - it: "Bug#3 - webhook-certificate does NOT render in standalone mode"
    template: templates/webhook-certificate.yaml
    set:
      mode: standalone
    asserts:
      - hasDocuments:
          count: 0

  # ============================================================
  # Bug #4: NOTES.txt must be mode-aware.
  # Validates NOTES.txt renders differently for each mode.
  # ============================================================
  - it: "Bug#4 - NOTES.txt mentions Standalone in standalone mode"
    template: templates/NOTES.txt
    set:
      mode: standalone
    asserts:
      - matchRegex:
          path: ""
          pattern: "Mode: Standalone"

  - it: "Bug#4 - NOTES.txt mentions Kubernetes in kubernetes mode"
    template: templates/NOTES.txt
    set:
      mode: kubernetes
    asserts:
      - matchRegex:
          path: ""
          pattern: "Mode: Kubernetes"

  # ============================================================
  # Bug #5: wait-for-postgres init containers must be gated on postgres.enabled.
  # Previously they always rendered even when postgres.enabled=false.
  # ============================================================
  - it: "Bug#5 - apiserver has NO init containers when postgres.enabled=false"
    template: templates/apiserver-deployment.yaml
    set:
      mode: standalone
      postgres.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.initContainers

  - it: "Bug#5 - controller-manager has NO init containers when postgres.enabled=false"
    template: templates/controller-manager-deployment.yaml
    set:
      mode: standalone
      postgres.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.initContainers

  - it: "Bug#5 - apiserver HAS init containers when postgres.enabled=true"
    template: templates/apiserver-deployment.yaml
    set:
      mode: standalone
      postgres.enabled: true
    asserts:
      - isNotNull:
          path: spec.template.spec.initContainers

  # ============================================================
  # Bug #6: Webhook port/volumes in k8s-controller gated on webhook.enabled.
  # Previously they always rendered.
  # ============================================================
  - it: "Bug#6 - k8s-controller has NO webhook port when webhook.enabled=false"
    template: templates/k8s-controller-deployment.yaml
    set:
      mode: kubernetes
      webhook.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9443
            name: webhook

  - it: "Bug#6 - k8s-controller has NO volumes when webhook.enabled=false"
    template: templates/k8s-controller-deployment.yaml
    set:
      mode: kubernetes
      webhook.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.volumes

  - it: "Bug#6 - k8s-controller HAS webhook port when webhook.enabled=true"
    template: templates/k8s-controller-deployment.yaml
    set:
      mode: kubernetes
      webhook.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9443
            name: webhook

  - it: "Bug#6 - k8s-controller HAS volumes when webhook.enabled=true"
    template: templates/k8s-controller-deployment.yaml
    set:
      mode: kubernetes
      webhook.enabled: true
    asserts:
      - isNotNull:
          path: spec.template.spec.volumes

  # ============================================================
  # Bug #7: Webhook service selector must include app.kubernetes.io/instance.
  # Previously it was missing, causing selector mismatch.
  # ============================================================
  - it: "Bug#7 - webhook-service selector includes instance label"
    template: templates/webhook-service.yaml
    set:
      mode: kubernetes
    asserts:
      - isNotNull:
          path: spec.selector["app.kubernetes.io/instance"]
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: "Bug#7 - webhook-service selector includes all three matching labels"
    template: templates/webhook-service.yaml
    set:
      mode: kubernetes
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: kognition
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: k8s-controller
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
