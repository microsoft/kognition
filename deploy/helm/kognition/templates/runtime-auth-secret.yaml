{{- if and .Values.runtimeAuth.create (not .Values.runtimeAuth.existingSecret) }}
{{- $name := printf "%s-runtime-auth" (include "kognition.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := default (dict) $existing.data }}
{{- $bindingKeys := list (dict "version" 1 "epoch" 1 "algorithm" "HMAC-SHA-256" "domain" "kognition.dev/runtime-approval/action/v1" "status" "Active" "material" (randAlphaNum 48 | b64enc)) | toJson | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-auth
type: Opaque
data:
  runtime-control-token: {{ if hasKey $existingData "runtime-control-token" }}{{ index $existingData "runtime-control-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  runtime-approval-binding-keys.json: {{ if hasKey $existingData "runtime-approval-binding-keys.json" }}{{ index $existingData "runtime-approval-binding-keys.json" }}{{ else }}{{ $bindingKeys }}{{ end }}
{{- end }}