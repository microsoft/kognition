{{- if and (eq .Values.mode "kubernetes") .Values.networkPolicy.enabled .Values.networkPolicy.kubernetesApiEgressCIDRs }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-kubernetes-api" (include "kognition.fullname" . | trunc 47 | trimSuffix "-") }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    {{- include "kognition.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - k8s-controller
          - memory-service
          - memory-policy-gateway
          - tool-gateway
          - model-gateway
          - agent-communication-gateway
          {{- if .Values.knowledgeGateway.enabled }}
          - knowledge-gateway
          {{- end }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.networkPolicy.kubernetesApiEgressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- end }}
