{{- if and (eq .Values.mode "kubernetes") .Values.memoryService.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kognition.fullname" . }}-memory-service-audit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-service
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kognition.fullname" . }}-memory-service-audit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kognition.fullname" . }}-memory-service-audit
subjects:
  - kind: ServiceAccount
    name: {{ include "kognition.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}