{{- if and .Values.memoryService.enabled .Values.memoryPolicyGateway.enabled .Values.memoryPolicyGateway.secret.create }}
{{- $name := printf "%s-memory-policy-gateway" (include "kognition.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := default (dict) $existing.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-policy-gateway
type: Opaque
data:
  capability-hmac-key: {{ if hasKey $existingData "capability-hmac-key" }}{{ index $existingData "capability-hmac-key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  capability-hmac-key-id: {{ if hasKey $existingData "capability-hmac-key-id" }}{{ index $existingData "capability-hmac-key-id" }}{{ else }}{{ "active" | b64enc }}{{ end }}
  {{- if hasKey $existingData "capability-hmac-previous-key" }}
  capability-hmac-previous-key: {{ index $existingData "capability-hmac-previous-key" }}
  capability-hmac-previous-key-id: {{ if hasKey $existingData "capability-hmac-previous-key-id" }}{{ index $existingData "capability-hmac-previous-key-id" }}{{ else }}{{ "active" | b64enc }}{{ end }}
  {{- end }}
  upstream-token: {{ if $existing }}{{ index $existing.data "upstream-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  runtime-control-token: {{ if $existing }}{{ index $existing.data "runtime-control-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}