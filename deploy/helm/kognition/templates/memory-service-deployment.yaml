{{- if .Values.memoryService.enabled }}
{{- $embedding := .Values.memoryService.embedding }}
{{- $azureIdentitySecret := default "" $embedding.azureIdentitySecret }}
{{- $configuredEmbeddingFields := compact (list $embedding.provider $embedding.endpoint $embedding.model) }}
{{- if and (gt (len $configuredEmbeddingFields) 0) (lt (len $configuredEmbeddingFields) 3) }}
{{- fail "memoryService.embedding.provider, endpoint, and model must be configured together" }}
{{- end }}
{{- if and $embedding.apiVersion (ne $embedding.provider "foundry") }}
{{- fail "memoryService.embedding.apiVersion is only supported when provider is foundry" }}
{{- end }}
{{- if ne (empty $embedding.apiKeySecret.name) (empty $embedding.apiKeySecret.key) }}
{{- fail "memoryService.embedding.apiKeySecret.name and key must be configured together" }}
{{- end }}
{{- if and (empty $embedding.provider) (not (empty $embedding.apiKeySecret.name)) }}
{{- fail "memoryService.embedding.apiKeySecret requires provider, endpoint, and model" }}
{{- end }}
{{- if and $azureIdentitySecret (ne $embedding.provider "foundry") }}
{{- fail "memoryService.embedding.azureIdentitySecret requires the foundry provider" }}
{{- end }}
{{- if and $azureIdentitySecret $embedding.apiKeySecret.name }}
{{- fail "memoryService.embedding.azureIdentitySecret and apiKeySecret are mutually exclusive" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kognition.fullname" . }}-memory-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-service
spec:
  replicas: {{ .Values.memoryService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: memory-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "kognition.labels" . | nindent 8 }}
        app.kubernetes.io/component: memory-service
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if and (eq $embedding.provider "foundry") (empty $embedding.apiKeySecret.name) (empty $azureIdentitySecret) }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "kognition.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: memory-service
          image: {{ include "kognition.image" (dict "global" .Values.global "image" .Values.memoryService.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.memoryService.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: MEMORY_SERVICE_ADDR
              value: ":8090"
            - name: MEMORY_BACKEND_TYPE
              value: {{ .Values.memoryService.backendType | quote }}
            {{- if eq .Values.mode "kubernetes" }}
            - name: KOGNITION_AUDIT_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            {{- if .Values.memoryPolicyGateway.enabled }}
            - name: MEMORY_SERVICE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kognition.fullname" . }}-memory-policy-gateway
                  key: upstream-token
            {{- end }}
            {{- if eq .Values.memoryService.backendType "pgvector" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kognition.databaseSecretName" . }}
                  key: DATABASE_URL
            {{- end }}
            {{- with .Values.memoryService.embedding }}
            {{- if .provider }}
            - name: MEMORY_EMBEDDING_PROVIDER
              value: {{ .provider | quote }}
            - name: MEMORY_EMBEDDING_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: MEMORY_EMBEDDING_MODEL
              value: {{ .model | quote }}
            {{- if .apiVersion }}
            - name: MEMORY_EMBEDDING_API_VERSION
              value: {{ .apiVersion | quote }}
            {{- end }}
            {{- if .apiKeySecret.name }}
            - name: MEMORY_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .apiKeySecret.name | quote }}
                  key: {{ .apiKeySecret.key | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $azureIdentitySecret }}
            {{- range $key := list "AZURE_TENANT_ID" "AZURE_CLIENT_ID" "AZURE_CLIENT_SECRET" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $azureIdentitySecret | quote }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/memory/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/memory/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            {{- toYaml .Values.memoryService.resources | nindent 12 }}
      {{- with .Values.memoryService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.memoryService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.memoryService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
