{{- $observability := default (dict) .Values.observability }}
{{- $metrics := default (dict) $observability.metrics }}
{{- $serviceMonitor := default (dict) $metrics.serviceMonitor }}
{{- if and (eq .Values.mode "kubernetes") $serviceMonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kognition.fullname" . }}-k8s-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "kognition.name" . }}
    app.kubernetes.io/component: k8s-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kognition.fullname" . }}-k8s-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    {{- with $serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: k8s-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  endpoints:
    - port: metrics
      path: /metrics
      honorLabels: true
      interval: {{ default "30s" $serviceMonitor.interval | quote }}
{{- end }}