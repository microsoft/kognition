{{- $gateway := default (dict) .Values.agentCommunicationGateway }}
{{- if and (eq .Values.mode "kubernetes") $gateway.enabled $gateway.secret.create }}
{{- $name := printf "%s-agent-communication-gateway" (include "kognition.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := default (dict) $existing.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  capability-hmac-key: {{ if hasKey $existingData "capability-hmac-key" }}{{ index $existingData "capability-hmac-key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  capability-hmac-key-id: {{ if hasKey $existingData "capability-hmac-key-id" }}{{ index $existingData "capability-hmac-key-id" }}{{ else }}{{ "active" | b64enc }}{{ end }}
  {{- if hasKey $existingData "capability-hmac-previous-key" }}
  capability-hmac-previous-key: {{ index $existingData "capability-hmac-previous-key" }}
  capability-hmac-previous-key-id: {{ if hasKey $existingData "capability-hmac-previous-key-id" }}{{ index $existingData "capability-hmac-previous-key-id" }}{{ else }}{{ "active" | b64enc }}{{ end }}
  {{- end }}
{{- end }}
