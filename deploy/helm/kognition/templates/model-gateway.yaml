{{- $modelGateway := default (dict) .Values.modelGateway }}
{{- if and (eq .Values.mode "kubernetes") $modelGateway.enabled }}
{{- $name := printf "%s-model-gateway" (include "kognition.fullname" .) }}
{{- $modelGatewayImage := default (dict "repository" "kognition-model-gateway" "tag" "" "pullPolicy" "IfNotPresent") $modelGateway.image }}
{{- $modelGatewayService := default (dict) $modelGateway.service }}
{{- $modelGatewayResources := default (dict) $modelGateway.resources }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: ["kognition.dev"]
    resources: ["agents", "agentinstances", "agentidentities", "agentpolicies", "modelclasses", "modelgrants", "models", "modelinvocationprofiles", "secretrefs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kognition.dev"]
    resources: ["cognitivequotas"]
    verbs: ["get", "list"]
  - apiGroups: ["kognition.dev"]
    resources: ["cognitivequotas/status"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-cost
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-cost
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-cost
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-gateway
spec:
  replicas: {{ default 1 $modelGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: model-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "kognition.labels" . | nindent 8 }}
        app.kubernetes.io/component: model-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: model-gateway
          image: {{ include "kognition.image" (dict "global" .Values.global "image" $modelGatewayImage "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ default "IfNotPresent" $modelGatewayImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8093
          env:
            - name: LISTEN_ADDR
              value: ":8093"
            - name: KOGNITION_COST_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: MODEL_CAPABILITY_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: capability-hmac-key
            - name: MODEL_CAPABILITY_HMAC_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: capability-hmac-key-id
            - name: MODEL_CAPABILITY_HMAC_PREVIOUS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: capability-hmac-previous-key
                  optional: true
            - name: MODEL_CAPABILITY_HMAC_PREVIOUS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: capability-hmac-previous-key-id
                  optional: true
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml $modelGatewayResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: model-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ default 8093 $modelGatewayService.port }}
      targetPort: http
      protocol: TCP
{{- end }}
