{{- if eq .Values.mode "kubernetes" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kognition.fullname" . }}-quota-ledger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-controller
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "create", "update"]
{{- end }}