{{- /*
Ingress for the standalone API server. Off by default (ingress.enabled).
Only rendered in standalone mode — kubernetes mode is fronted by the
Kubernetes API server itself.
*/ -}}
{{- if and .Values.ingress.enabled (eq .Values.mode "standalone") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kognition.fullname" . }}-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "kognition.fullname" $ }}-apiserver
                port:
                  number: {{ $.Values.apiserver.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
