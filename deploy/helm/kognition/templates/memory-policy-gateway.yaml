{{- if and (eq .Values.mode "kubernetes") .Values.memoryService.enabled .Values.memoryPolicyGateway.enabled }}
{{- $name := printf "%s-memory-policy-gateway" (include "kognition.fullname" .) }}
{{- $secretName := printf "%s-memory-policy-gateway" (include "kognition.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-policy-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-runtime-identity
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-runtime-identity
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-runtime-identity
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-policy-gateway
rules:
  - apiGroups: ["kognition.dev"]
    resources: ["agents", "agentinstances", "agentidentities", "agentroles", "agentrolebindings", "memoryclaims", "memorygrants", "memoryvolumes"]
    verbs: ["get", "list"]
  # ADR-0014 Gate 3: resolve autonomy policy (TrustProfile + AutonomyClass)
  # and persist RuntimeApprovals for Memory ReadWrite operations.
  - apiGroups: ["kognition.dev"]
    resources: ["trustprofiles", "trustprofileindices", "autonomyclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kognition.dev"]
    resources: ["runtimeapprovals"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["kognition.dev"]
    resources: ["runtimeapprovals/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kognition.dev"]
    resources: ["runtimeapprovaltombstones"]
    verbs: ["get"]
  - apiGroups: ["kognition.dev"]
    resources: ["runtimeapprovalquotatickets"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["kognition-runtime-approval-records"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-policy-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-audit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-policy-gateway
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-audit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-policy-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-audit
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-policy-gateway
spec:
  replicas: {{ .Values.memoryPolicyGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: memory-policy-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "kognition.labels" . | nindent 8 }}
        app.kubernetes.io/component: memory-policy-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: memory-policy-gateway
          image: {{ include "kognition.image" (dict "global" .Values.global "image" .Values.memoryPolicyGateway.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.memoryPolicyGateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: LISTEN_ADDR
              value: ":8091"
            - name: KOGNITION_RUNTIME_APPROVAL_WORKLOAD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: KOGNITION_MEMORY_POLICY_GATEWAY_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: KOGNITION_RUNTIME_APPROVAL_MAXIMUM_CLOCK_SKEW
              value: {{ .Values.runtimeAuth.maximumClockSkew | quote }}
            - name: KOGNITION_RUNTIME_APPROVAL_BINDING_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-runtime-auth" (include "kognition.fullname" .)) .Values.runtimeAuth.existingSecret }}
                  key: runtime-approval-binding-keys.json
            - name: KOGNITION_MEMORY_SERVICE_URL
              value: "http://{{ include "kognition.fullname" . }}-memory-service.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.memoryService.service.port }}"
            - name: KOGNITION_AUDIT_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kognition.databaseSecretName" . }}
                  key: DATABASE_URL
            - name: MEMORY_CAPABILITY_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: capability-hmac-key
            - name: MEMORY_CAPABILITY_HMAC_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: capability-hmac-key-id
            - name: MEMORY_CAPABILITY_HMAC_PREVIOUS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: capability-hmac-previous-key
                  optional: true
            - name: MEMORY_CAPABILITY_HMAC_PREVIOUS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: capability-hmac-previous-key-id
                  optional: true
            - name: MEMORY_SERVICE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: upstream-token
          readinessProbe:
            httpGet:
              path: /v1/memory/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/memory/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            {{- toYaml .Values.memoryPolicyGateway.resources | nindent 12 }}
      {{- with .Values.memoryPolicyGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.memoryPolicyGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.memoryPolicyGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-policy-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: memory-policy-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.memoryPolicyGateway.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}