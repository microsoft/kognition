{{- if and (not .Values.postgres.auth.existingSecret) (or (eq .Values.mode "standalone") (eq .Values.memoryService.backendType "pgvector") (and (eq .Values.mode "kubernetes") .Values.memoryService.enabled .Values.memoryPolicyGateway.enabled)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kognition.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kognition.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "kognition.databaseDSN" . | quote }}
{{- end }}
