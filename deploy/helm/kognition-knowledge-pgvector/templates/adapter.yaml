{{- if .Values.adapter.enabled }}
{{- $adapter := .Values.adapter }}
{{- $name := printf "%s-pgvector" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" $adapter.image) }}
{{- fail "adapter.image must be an explicitly reviewed digest-pinned reference" }}
{{- end }}
{{- if and $adapter.networkPolicy.enabled (not $adapter.networkPolicy.ciliumApiServerEgress) (not $adapter.networkPolicy.kubernetesApiEgressCIDRs) }}
{{- fail "adapter NetworkPolicy requires explicit Kubernetes API routes" }}
{{- end }}
{{- if and $adapter.networkPolicy.ciliumApiServerEgress (not $adapter.networkPolicy.enabled) }}
{{- fail "adapter Cilium API egress requires enforced NetworkPolicy" }}
{{- end }}
{{- if and $adapter.networkPolicy.ciliumHostProbeIngress (not $adapter.networkPolicy.enabled) }}
{{- fail "adapter Cilium probe ingress requires enforced NetworkPolicy" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: ["kognition.dev"]
    resources: ["knowledgebaseclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ required "adapter.watchNamespace is required" $adapter.watchNamespace }}
rules:
  - apiGroups: ["kognition.dev"]
    resources: ["knowledgebases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pgvector.knowledge.kognition.dev"]
    resources: ["pgvectorbackends"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    {{- with $adapter.secretNames }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $adapter.watchNamespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: knowledge-pgvector
    spec:
      serviceAccountName: {{ $name }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: adapter
          image: {{ $adapter.image | quote }}
          imagePullPolicy: {{ $adapter.imagePullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          env:
            - {name: KOGNITION_KNOWLEDGE_WATCH_NAMESPACE, value: {{ $adapter.watchNamespace | quote }}}
            - {name: KOGNITION_KNOWLEDGE_CLIENT_PEER_URI, value: {{ required "adapter.clientPeerURI is required" $adapter.clientPeerURI | quote }}}
            - {name: KOGNITION_PGVECTOR_DATABASE_ADDRESS, value: {{ required "adapter.databaseAddress is required" $adapter.databaseAddress | quote }}}
            - {name: KOGNITION_KNOWLEDGE_TLS_CERT_FILE, value: /var/run/provider-tls/tls.crt}
            - {name: KOGNITION_KNOWLEDGE_TLS_KEY_FILE, value: /var/run/provider-tls/tls.key}
            - {name: KOGNITION_KNOWLEDGE_TLS_CA_FILE, value: /var/run/provider-tls/ca.crt}
          ports:
            - {name: grpc, containerPort: 9443}
            - {name: admin, containerPort: 9092}
          readinessProbe: {httpGet: {path: /readyz, port: admin}}
          livenessProbe: {httpGet: {path: /healthz, port: admin}}
          resources:
            {{- toYaml $adapter.resources | nindent 12 }}
          volumeMounts:
            - {name: tls, mountPath: /var/run/provider-tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls
          secret: {secretName: {{ required "adapter.tlsSecretName is required" $adapter.tlsSecretName | quote }}}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports: [{name: grpc, port: 9443, targetPort: grpc}]
{{- if $adapter.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- range $client := required "adapter.networkPolicy.clients must explicitly select trusted callers" $adapter.networkPolicy.clients }}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ required "provider client namespace is required" $client.namespace | quote }}}
          podSelector:
            matchLabels:
              {{- required "provider client podSelector is required" $client.podSelector | toYaml | nindent 14 }}
      ports: [{protocol: TCP, port: 9443}]
    {{- end }}
    {{- if not $adapter.networkPolicy.ciliumHostProbeIngress }}
    {{- range $cidr := required "adapter.networkPolicy.kubeletProbeIngressCIDRs is required" $adapter.networkPolicy.kubeletProbeIngressCIDRs }}
    {{- if not (or (hasSuffix "/32" $cidr) (hasSuffix "/128" $cidr)) }}
    {{- fail "adapter kubelet probe ingress must use exact reviewed node addresses" }}
    {{- end }}
    - from: [{ipBlock: {cidr: {{ $cidr | quote }}}}]
      ports: [{protocol: TCP, port: 9092}]
    {{- end }}
    {{- end }}
  egress:
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $adapter.networkPolicy.databaseNamespace | quote }}}
          podSelector:
            matchLabels:
              {{- required "adapter.networkPolicy.databasePodSelector is required" $adapter.networkPolicy.databasePodSelector | toYaml | nindent 14 }}
      ports: [{protocol: TCP, port: {{ $adapter.networkPolicy.databasePort }}}]
    {{- range $cidr := $adapter.networkPolicy.kubernetesApiEgressCIDRs }}
    - to: [{ipBlock: {cidr: {{ $cidr | quote }}}}]
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
    {{- end }}
{{- if $adapter.networkPolicy.ciliumApiServerEgress }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels: {k8s:app.kubernetes.io/name: {{ $name }}}
  egress:
    - toEntities: [host, kube-apiserver]
      toPorts:
        - ports: [{port: "443", protocol: TCP}, {port: "6443", protocol: TCP}]
{{- end }}
{{- if $adapter.networkPolicy.ciliumHostProbeIngress }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-probes
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels: {k8s:app.kubernetes.io/name: {{ $name }}}
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEntities: [host, remote-node, health]
      toPorts:
        - ports: [{port: "9092", protocol: TCP}]
{{- end }}
{{- end }}
{{- end }}
