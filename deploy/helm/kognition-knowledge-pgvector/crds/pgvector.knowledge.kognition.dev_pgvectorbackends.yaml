apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pgvectorbackends.pgvector.knowledge.kognition.dev
spec:
  group: pgvector.knowledge.kognition.dev
  scope: Namespaced
  names:
    plural: pgvectorbackends
    singular: pgvectorbackend
    kind: PgvectorBackend
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [host, port, database, table, embeddingDimensions, credentialsSecretRef, tls]
              properties:
                host:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                database:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z_][a-z0-9_]{0,62}$'
                table:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z_][a-z0-9_]{0,62}$'
                embeddingDimensions:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 2000
                credentialsSecretRef:
                  type: object
                  required: [name, usernameKey, passwordKey]
                  x-kubernetes-validations:
                    - rule: self.usernameKey != self.passwordKey
                      message: usernameKey and passwordKey must differ
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                    usernameKey:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[-._a-zA-Z0-9]+$'
                      x-kubernetes-validations:
                        - rule: "self != '.' && !self.startsWith('..')"
                          message: invalid Secret key
                    passwordKey:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[-._a-zA-Z0-9]+$'
                      x-kubernetes-validations:
                        - rule: "self != '.' && !self.startsWith('..')"
                          message: invalid Secret key
                tls:
                  type: object
                  required: [mode]
                  properties:
                    mode:
                      type: string
                      enum: [verify-full]
                    caSecretRef:
                      type: object
                      required: [name, key]
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 253
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                        key:
                          type: string
                          minLength: 1
                          maxLength: 253
                          pattern: '^[-._a-zA-Z0-9]+$'
                          x-kubernetes-validations:
                            - rule: "self != '.' && !self.startsWith('..')"
                              message: invalid Secret key